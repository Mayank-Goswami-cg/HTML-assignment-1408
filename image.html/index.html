<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Image Assignment</title>
</head>
<body>

<h1>HTML Image Assignment</h1>

<h2>Question 1</h2>
<img src="flower.jpg" alt="Beautiful flower">

<h2>Question 2</h2>
<img src="images/logo.png" alt="Company logo" width="200px">

<h2>Question 3</h2>
<img src="assets/images/banner.jpg" alt="Website banner">

<h2>Question 4</h2>
<img src="../photo.jpg" alt="A personal photo">

<h2>Question 5</h2>
<img src="images/nature.jpg" alt="Beautiful nature view" width="300" height="200">

<h2>Question 6</h2>
<img src="images/logo.png" alt="Sample image" title="Click to view full size">

<h2>Question 7</h2>
<img src="images/nature.jpg" alt="Nature scene" loading="lazy">

<h2>Question 8</h2>
<img src="images/hero.jpg" alt="Hero image" loading="eager">

<h2>Question 9</h2>
<img src="images/example.jpg" alt="Example image" loading="auto">

<h2>Question 10</h2>
<img
    src="medium.jpg"
    srcset="small.jpg 400w, medium.jpg 800w, large.jpg 1200w"
    alt="Responsive image"
>

<h2>Question 11</h2>
<img
    src="images/gallery.jpg"
    alt="Gallery image"
    width="600"
    height="400"
    loading="lazy"
    title="View gallery image"
    srcset="images/gallery-small.jpg 400w, images/gallery-large.jpg 800w"
>

<h2>Question 12</h2>
<div>
    <img
        src="assets/logo.png"
        alt="Company logo"
        width="250px"
        loading="eager"
        style="display: inline-block;"
    >

    <img
        src="images/products/shoe.jpg"
        alt="Product shoe"
        width="250px"
        loading="lazy"
        style="display: inline-block;"
    >
</div>

</body>
</html>
